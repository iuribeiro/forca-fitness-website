<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A new Força Fitness experience is coming soon." />
  <title>Força Fitness | Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f4ee;
      --muted: #aaa69d;
      --orange: #ff5b22;
      --charcoal: #121212;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 91, 34, 0.2), transparent 28rem),
        linear-gradient(135deg, rgba(23, 23, 23, 0.94), rgba(9, 9, 9, 0.78) 70%),
        url("force-fitness-hero.png") center / cover no-repeat;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image: repeating-linear-gradient(115deg, transparent 0 22px, #fff 23px, transparent 24px);
    }

    main {
      width: min(90vw, 760px);
      padding: clamp(2rem, 7vw, 5rem);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 18, 18, 0.76);
      backdrop-filter: blur(12px);
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      margin: 0 0 1.5rem;
      color: var(--orange);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 9ch;
      margin: 0;
      font-size: clamp(3.6rem, 12vw, 8rem);
      line-height: 0.82;
      letter-spacing: -0.07em;
      text-transform: uppercase;
    }

    h1 span { color: var(--orange); }

    .rule {
      width: 4rem;
      height: 0.35rem;
      margin: 2.25rem 0;
      background: var(--orange);
    }

    p {
      max-width: 31rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      line-height: 1.65;
    }

    strong { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Ajax, Ontario · New site in training</p>
    <h1>Força <span>Fitness</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p><strong>Something stronger is coming.</strong> We’re building a new online home for our community. Check back soon.</p>
  </main>
</body>
</html>
